<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff4d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ひねくれ家計簿">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ひねくれ家計簿</title>

  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3">

  <style>
    :root{--bg:#fff4d8;--ink:#4d392d}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--bg)}
    body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
    .loading{text-align:center;padding:24px;font-weight:800}
    .loading small{display:block;margin-top:8px;font-size:12px;font-weight:700;opacity:.7}
  </style>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxqA6qYl-dWPsmeNe3NyWJaHvVkLOrIZEl38TJNL0RaqFi0U78_QxIF7YkSFtANmR0a/exec';
    // Safari/iOSではGoogle Apps Scriptをiframe内で開くと
    // Google認証・Cookie制限で401になることがあるため、トップレベルで直接開く。
    window.location.replace(APP_URL);
  </script>
</head>
<body>
  <div class="loading">ひねくれ家計簿を開いています…
    <small>自動で開かない場合はページを再読み込みしてください。</small>
  </div>
</body>
</html>
