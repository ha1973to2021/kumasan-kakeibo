<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff4d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ひねくれ家計簿">
  <title>ひねくれ家計簿</title>

  <link rel="manifest" href="/kumasan-kakeibo/manifest.webmanifest?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/kumasan-kakeibo/icon-180-v4.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/kumasan-kakeibo/icon-192-v4.png">

  <style>
    :root{--bg:#fff4d8;--ink:#4f453f}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
    .app-shell{position:fixed;inset:0;width:100%;height:100dvh;background:var(--bg)}
    .app-frame{display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:var(--bg)}
  </style>
</head>
<body>
  <main class="app-shell">
    <iframe
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbxqA6qYl-dWPsmeNe3NyWJaHvVkLOrIZEl38TJNL0RaqFi0U78_QxIF7YkSFtANmR0a/exec"
      title="ひねくれ家計簿"
      allow="clipboard-read; clipboard-write; camera"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
</body>
</html>
